<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Квиз: Подземные воды</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #333;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c5aa0;
    }
    .question-block {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 18px;
    }
    .question-text {
      font-weight: bold;
      font-size: 1.05rem;
      margin-bottom: 12px;
    }
    .options label {
      display: block;
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .options label:hover {
      background: #eef6ff;
    }
    button {
      display: block;
      width: 100%;
      padding: 14px;
      background: #2c5aa0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #1f4575;
    }
    #result {
      margin-top: 24px;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .correct-answer {
      color: #27ae60;
      font-weight: bold;
    }
    .wrong-answer {
      color: #c0392b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Квиз по теме «Подземные воды»</h1>

  <form id="quiz-form">
    <!-- Вопрос 1 -->
    <div class="question-block">
      <div class="question-text">1. Что делают водопроницаемые породы?</div>
      <div class="options">
        <label><input type="radio" name="q1" value="wrong"> Полностью отталкивают воду</label>
        <label><input type="radio" name="q1" value="correct"> Пропускают воду сквозь себя</label>
        <label><input type="radio" name="q1" value="wrong"> Испаряют воду сразу после попадания</label>
      </div>
    </div>

    <!-- Вопрос 2 -->
    <div class="question-block">
      <div class="question-text">2. Какая порода чаще всего работает как водоупорный слой?</div>
      <div class="options">
        <label><input type="radio" name="q2" value="wrong"> Песок</label>
        <label><input type="radio" name="q2" value="wrong"> Щебень</label>
        <label><input type="radio" name="q2" value="correct"> Глина</label>
      </div>
    </div>

    <!-- Вопрос 3 -->
    <div class="question-block">
      <div class="question-text">3. Где образуется водоносный горизонт?</div>
      <div class="options">
        <label><input type="radio" name="q3" value="correct"> Над водоупорным слоем</label>
        <label><input type="radio" name="q3" value="wrong"> Внутри водопроницаемого слоя без упора</label>
        <label><input type="radio" name="q3" value="wrong"> Прямо на поверхности земли</label>
      </div>
    </div>

    <!-- Вопрос 4 -->
    <div class="question-block">
      <div class="question-text">4. Когда появляется родник?</div>
      <div class="options">
        <label><input type="radio" name="q4" value="wrong"> Когда вода испаряется с поверхности</label>
        <label><input type="radio" name="q4" value="correct"> Когда водоупорный пласт выходит на склон и вода выходит наружу</label>
        <label><input type="radio" name="q4" value="wrong"> Когда люди копают колодец</label>
      </div>
    </div>

    <!-- Вопрос 5 -->
    <div class="question-block">
      <div class="question-text">5. Чем колодец отличается от скважины по способу добычи воды?</div>
      <div class="options">
        <label><input type="radio" name="q5" value="wrong"> Колодец бурят, а скважину копают лопатой</label>
        <label><input type="radio" name="q5" value="correct"> Колодец берёт воду из верхнего водоносного горизонта, скважина — из более глубоких слоёв</label>
        <label><input type="radio" name="q5" value="wrong"> Это одно и то же, просто разные названия</label>
      </div>
    </div>

    <button type="button" onclick="checkQuiz()">Проверить результаты</button>
  </form>

  <div id="result"></div>

  <script>
    function checkQuiz() {
      const form = document.getElementById('quiz-form');
      const resultDiv = document.getElementById('result');
      let score = 0;

      // Проверяем ответы
      for (let i = 1; i <= 5; i++) {
        const selected = form.querySelector(`input[name="q${i}"]:checked`);
        if (selected && selected.value === 'correct') {
          score++;
        }
      }

      // Показываем результат
      resultDiv.style.display = 'block';
      if (score === 5) {
        resultDiv.innerHTML = `<p style="color:#27ae60; font-size:1.2rem;">Отлично! Ты ответил правильно на все 5 вопросов! 🎉</p>`;
      } else if (score >= 3) {
        resultDiv.innerHTML = `<p>Ты ответил правильно на ${score} из 5 вопросов. Хороший результат! 👍</p>`;
      } else {
        resultDiv.innerHTML = `<p style="color:#c0392b;">Ты ответил правильно на ${score} из 5. Попробуй ещё раз — тема интересная! 🤓</p>`;
      }
    }
  </script>
</body>
</html>
